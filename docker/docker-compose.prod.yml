# Production deployment. Keywords are extracted with a local BERT model on
# CPU; the default model is downloaded from Hugging Face on first start.

services:
  radar-keyword-search:
    image: docker.dev.fiz-karlsruhe.de/radar-keyword-search:0.1
    container_name: radar-keyword-search
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      # Optional: BERT model used when a request names none (see GET /models)
      BERT_MODEL: pubmedbert
